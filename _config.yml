# Site settings
title: "Bo Tran – DevOps & Database notes"
email: tranbo9xnd@gmail.com
description: "Ghi chép về DevOps, database high availability, replication và migration (PostgreSQL, MySQL, MongoDB, Redis, OpenStack)."
lang: vi
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://botranvan.github.io" # the base hostname & protocol for your site

# Paginate
#gems: [jekyll-paginate]
# Number of post on per page.
#paginate: 10
#paginate_path: "page:num"


# Build settings
# markdown
#highlighter: pygments
# markdown compile
#markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - _drafts

#relative_permalinks: true
# type of link for post on blog
permalink: /:year-:month-:day-:title.html

favicon: /assets/image/favicon.ico

# Information
author:
  name: Bo Tran
  email: tranbo9xnd@gmail.com
  link: https://botranvan.github.io/
  facebook: https://facebook.com/Ministry.Nd
  facebook_username: Ministry.Nd
  github: https://github.com/botranvan
  github_username: botranvan


locals:
  tags: tags
  about: about
  active: tech
subscribe_rss: /pages/rss.xml

# Avatar
avatar: /assets/image/avatar.png
# CSS
css: /assets/css/
# Javascript
js: /assets/js/
# Images
image: /assets/image/

# disqus setting
disqus:
  shortname: botranvan
