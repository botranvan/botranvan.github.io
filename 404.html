---
layout: page
title: Page not found
---

<div class="notfound">
  <img src="{{ site.image }}404.jpg" alt="404 - Page not found">
  <p>The page you are looking for does not exist or has moved.</p>
  <button type="button" class="notfound__search js-open-palette">⌕ Search posts… <kbd>Ctrl</kbd> <kbd>K</kbd></button>

  <h2>Latest posts</h2>
  <ul class="notfound__recent">
  {% for post in site.posts limit:5 %}
    <li><a href="{{ post.url }}">{{ post.title }}</a> <span class="pl__date">{{ post.date | date: "%d/%m/%Y" }}</span></li>
  {% endfor %}
  </ul>
  <p><a href="/">← Back to home</a></p>
</div>
