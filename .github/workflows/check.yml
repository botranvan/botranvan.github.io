name: Check site

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Check links and images
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --ignore-empty-alt
          --ignore-missing-alt
          --allow-missing-href
          --ignore-urls "/^#/"
