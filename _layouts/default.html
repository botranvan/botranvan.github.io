<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'vi' }}">
  <head>
    {% include header.html %}
  </head>
  <body>
    <button id="js-fullscreen" aria-label="Toggle fullscreen"><span id="icon-arrow" class="fontello"></span></button>
    <button id="scroll-top" aria-label="Scroll to top"><span id="icon-arrow-up" class="fontello"></span></button>

    {% include nav.html %}
    <div id="post">
      <div id="pjax">
        {{ content }}
        <br>
        <hr class="footer-divider">
        {% include copyright.html %}
      </div> <!-- end #pjax -->

      <div id="post__toc-trigger">
        <div id="post__toc">
          <span id="post__toc-title">List of contents</span>
          <ul id="post__toc-ul"></ul>
        </div>
      </div>
    </div> <!-- end #post -->
    {% include scripts.html %}
    <script id="dsq-count-scr" src="https://{{ site.disqus.shortname }}.disqus.com/count.js" async></script>
   </body>
 </html>
